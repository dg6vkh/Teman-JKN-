<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panduan Digital Mobile JKN</title>
<style>
:root{--ink:#000814;--prus:#001D3D;--navy:#003566;--yel:#FFC300;--gold:#FFD60A;--text:#000814;--bg1:#003566;--bg2:#001D3D;--bg3:#000814;--card-text:#000814;--muted:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#fff;background:var(--bg3);background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 40px}
nav{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
nav b{background:var(--yel);color:var(--ink);padding:6px 12px}
.hero{position:relative;padding:48px 0 32px}
.px{position:absolute;background:var(--yel);width:28px;height:28px}
.eyebrow{font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;color:var(--gold)}
h1{margin:0;font-size:clamp(2.6rem,9vw,5.5rem);line-height:.98;font-weight:900;letter-spacing:-.03em}
h1 span{display:inline-block;background:var(--yel);color:var(--ink);padding:0 .15em;margin-top:.1em;clip-path:polygon(0 0,100% 0,100% 70%,94% 70%,94% 100%,0 100%)}
.tag{font-style:italic;font-size:1.1rem;margin:18px 0 0;max-width:34ch;color:#e6ecf5}
.intro{margin:40px 0 20px}
.intro h2{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px;font-weight:900;letter-spacing:-.02em}
.intro p{margin:0;max-width:52ch;font-size:1.05rem;color:#e6ecf5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:24px}
.card{position:relative;background:var(--yel);color:var(--card-text);padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;border:0;font:inherit;clip-path:polygon(0 0,62% 0,62% 4%,78% 4%,78% 0,100% 0,100% 100%,0 100%);transition:transform .2s,background .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);background:var(--gold);outline:none}
.card .no{font-size:1.5rem;font-weight:800;align-self:flex-end}
.card svg{width:100%;height:120px;background:var(--prus);padding:10px}
.card small{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.card h3{margin:0;font-size:1.6rem;line-height:1.05;font-weight:900;letter-spacing:-.02em}
.card p{margin:0;font-size:.95rem;line-height:1.45;flex:1}
.btn{display:inline-block;background:var(--ink);color:var(--gold);padding:12px 18px;font-weight:800;letter-spacing:.06em;font-size:.85rem;text-align:center}
.back{background:var(--yel);color:var(--ink);border:0;padding:12px 18px;font-weight:800;font-size:.9rem;cursor:pointer;margin:24px 0 8px;letter-spacing:.04em}
.back:hover{background:var(--gold)}
.vwrap{position:relative;aspect-ratio:16/9;background:var(--ink);border:6px solid var(--yel);margin-top:16px}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vhead h2{font-size:clamp(1.9rem,6vw,3.4rem);margin:12px 0 8px;font-weight:900;letter-spacing:-.02em;line-height:1}
.vhead p{margin:0;color:#e6ecf5;max-width:60ch}
.others{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.others button{background:transparent;color:var(--gold);border:2px solid var(--yel);padding:10px 14px;font-weight:700;cursor:pointer;font-size:.85rem}
.others button:hover{background:var(--yel);color:var(--ink)}
footer{margin-top:56px;padding:28px 22px;background:var(--yel);color:var(--ink);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 18%,0 0);font-weight:700;font-size:1.15rem;text-align:center}
footer span{display:block;font-size:.75rem;margin-top:8px;font-weight:600;letter-spacing:.06em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#001D3D;--bg2:#000814;--bg3:#000814}}
@media (max-width:520px){.px{display:none}}
</style>
</head>
<body>
<div class="wrap">
<nav><b>Mobile JKN</b><span>Panduan Digital</span></nav>
<main id="app"></main>
<footer>Semoga panduan ini membantu Anda menggunakan layanan Mobile JKN dengan lebih mudah.<span>PANDUAN DIGITAL MOBILE JKN</span></footer>
</div>
<script>
var V=[
{id:"video-1",no:"01",cat:"Akun",t:"Pembuatan Akun Mobile JKN",d:"Panduan membuat dan mengaktifkan akun.",yt:"A4cbWm3GNLw",
 ic:'<rect x="40" y="10" width="40" height="76" rx="8" fill="none" stroke="#FFC300" stroke-width="4"/><circle cx="60" cy="40" r="9" fill="#FFC300"/><path d="M44 70c3-12 29-12 32 0" fill="#FFC300"/>'},
{id:"video-2",no:"02",cat:"Layanan",t:"Pendaftaran Antrean Online",d:"Panduan mengambil antrean melalui Mobile JKN.",yt:"VRdxiDJXSCA",
 ic:'<rect x="30" y="18" width="60" height="62" rx="6" fill="none" stroke="#FFC300" stroke-width="4"/><path d="M30 36h60M46 10v14M74 10v14" stroke="#FFC300" stroke-width="4"/><path d="M50 58l8 8 14-16" fill="none" stroke="#FFD60A" stroke-width="5"/>'},
{id:"video-3",no:"03",cat:"Faskes",t:"Pemindahan FKTP",d:"Panduan mengubah fasilitas kesehatan tingkat pertama.",yt:"XJ8m9v2HhcE",
 ic:'<path d="M26 84V34l34-20 34 20v50z" fill="none" stroke="#FFC300" stroke-width="4"/><path d="M52 42h16v12h12v14H68v12H52V68H40V54h12z" fill="#FFD60A" transform="translate(0,-4)"/>'}
];
var app=document.getElementById("app");
function home(){
  var h='<section class="hero"><i class="px" style="right:6%;top:30px"></i><i class="px" style="right:14%;top:90px;width:16px;height:16px;background:#FFD60A"></i><p class="eyebrow">Ensiklopedia seluler kesehatan</p><h1>PANDUAN<br><span>DIGITAL</span><br>MOBILE JKN</h1><p class="tag">Mudah Mengakses Layanan JKN, Cukup dari Genggaman</p></section>';
  h+='<section class="intro"><h2>Halo, Sobat JKN! 👋</h2><p>Masih bingung menggunakan Mobile JKN? Yuk, pelajari melalui tiga video tutorial berikut!</p></section><section class="grid">';
  V.forEach(function(v){h+='<button class="card" data-go="'+v.id+'" aria-label="'+v.t+'"><span class="no">'+v.no+'</span><svg viewBox="0 0 120 96" aria-hidden="true">'+v.ic+'</svg><small>'+v.cat+'</small><h3>'+v.t+'</h3><p>'+v.d+'</p><span class="btn">TONTON VIDEO ▶</span></button>'});
  app.innerHTML=h+'</section>';
}
function video(v){
  var o='';V.forEach(function(x){if(x.id!==v.id)o+='<button data-go="'+x.id+'">'+x.no+' · '+x.t+'</button>'});
  app.innerHTML='<button class="back" data-go="">← KEMBALI KE BERANDA</button><div class="vhead"><p class="eyebrow">Video '+v.no+' dari 03</p><h2>'+v.t+'</h2><p>'+v.d+'</p></div><div class="vwrap"><iframe src="https://www.youtube.com/embed/'+v.yt+'?rel=0" title="'+v.t+'" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="others">'+o+'</div>';
}
function route(){
  var k=location.hash.replace("#",""),v=V.filter(function(x){return x.id===k})[0];
  if(v)video(v);else home();
  window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(!b)return;
  var g=b.getAttribute("data-go");
  if(g)location.hash=g;else{history.pushState(null,"",location.pathname+location.search);route()}
});
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
